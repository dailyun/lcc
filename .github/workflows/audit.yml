name: Dependency audit

# Weekly and on demand, never on PRs: a newly published advisory in a dependency
# (typer, rich, pyyaml, tiktoken) should be reported, not block unrelated merges.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[tiktoken]" pip-audit
      - name: Audit installed packages
        run: |
          pip-audit --desc
