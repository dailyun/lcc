name: Dependency audit

# Weekly and on demand, never on PRs: a newly published advisory in a dependency
# (typer, rich, pyyaml, tiktoken) should be reported, not block unrelated merges.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[tiktoken]" pip-audit
      - name: Audit installed packages
        run: |
          pip-audit --desc
